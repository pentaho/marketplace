<div class="dialog">
  <div class="title">{{dialog.title}}</div>
  <div class="body">{{dialog.body}}</div>

  <button data-ng-repeat="button in dialog.buttons"
          data-ng-click="button.onClick()"
          data-ng-disabled="button.disabled">
    {{button.text}}
  </button>

</div>
